name: testes
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Dependencias
        run: pip install -r requirements.lock.txt
      - name: Navegador dos testes de interface
        run: |
          pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Testes (offline, sem os que precisam de arquivos fora do git)
        env:
          PYTHON_DOTENV_DISABLED: "1"
        run: python -m pytest -q -m "not local" -rs

  testes-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Dependencias
        run: pip install -r requirements.lock.txt
      - name: Testes contra PostgreSQL real (servico descartavel do CI)
        env:
          PYTHON_DOTENV_DISABLED: "1"
          PG_TESTE_URL: postgresql://postgres:teste@localhost:5432/postgres
        run: python -m pytest -q -m postgres -rs

  imagem:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sobe o painel atras do Caddy (demonstracao, https em localhost)
        env:
          DOMAIN_NAME: localhost
        run: docker compose up -d --build
      - name: Confere a entrada pelo HTTPS do Caddy
        run: |
          for i in $(seq 1 90); do
            codigo=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/entrar || true)
            [ "$codigo" = "200" ] && break
            sleep 2
          done
          [ "$codigo" = "200" ] || { echo "o painel nao respondeu (ultimo codigo: $codigo)"; exit 1; }
          curl -sk -c cookies.txt -D cabecalhos.txt -o entrar.html https://localhost/entrar
          cat cabecalhos.txt
          grep -qi '^strict-transport-security: max-age=31536000' cabecalhos.txt
          grep -qiE '^set-cookie: csrf=[^;]+;.*secure' cabecalhos.txt
          grep -q 'action="/entrar"' entrar.html
      - name: Confere o envio do proprio painel e a recusa de outro site atras do Caddy
        run: |
          token=$(grep -o 'name="csrf" value="[^"]*"' entrar.html | head -1 | sed 's/.*value="//; s/"$//')
          envio() {
            curl -sk -b cookies.txt -o /dev/null -w '%{http_code}' -H "Origin: $1" \
              --data-urlencode "login=ninguem" --data-urlencode "senha=errada-errada" --data-urlencode "proximo=/" \
              --data-urlencode "csrf=$token" https://localhost/entrar
          }
          codigo=$(envio https://localhost)
          [ "$codigo" = "400" ] || { echo "envio do proprio painel deveria dar 400 (credenciais), deu $codigo"; exit 1; }
          codigo=$(envio https://outro-site.example)
          [ "$codigo" = "403" ] || { echo "envio de outro site deveria dar 403, deu $codigo"; exit 1; }
      - name: Registros dos conteineres
        if: always()
        env:
          DOMAIN_NAME: localhost
        run: docker compose logs
