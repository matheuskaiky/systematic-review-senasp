<form class="filtros" method="get" action="{{ acao }}">
  <label>Perspectiva <select name="perspectiva">{% for chave, rotulo in perspectivas %}<option value="{{ chave }}"{% if filtros.perspectiva == chave %} selected{% endif %}>{{ rotulo }}</option>{% endfor %}</select></label>
  <label>Universo <select name="universo">{% for chave, rotulo in universos %}<option value="{{ chave }}"{% if filtros.universo == chave %} selected{% endif %}>{{ rotulo }}</option>{% endfor %}</select></label>
  <label>Combinação exata dos conjuntos <select name="combinacao"><option value="">qualquer</option>{% for chave, rotulo in comb_opcoes %}<option value="{{ chave }}"{% if filtros.combinacao == chave %} selected{% endif %}>{{ rotulo }}</option>{% endfor %}</select></label>
  <label>Achada no conjunto <select name="conjunto"><option value="">qualquer</option>{% for n in nomes %}<option value="{{ n }}"{% if filtros.conjunto == n %} selected{% endif %}>{{ n }}</option>{% endfor %}</select></label>
  <label>Fonte <select name="fonte"><option value="">qualquer</option>{% for chave, rotulo in fontes %}<option value="{{ chave }}"{% if filtros.fonte == chave %} selected{% endif %}>{{ rotulo }}</option>{% endfor %}</select></label>
  {% if filtros.perspectiva == "integrada" %}<label>Ângulo predominante <select name="angulo"><option value="">qualquer</option>{% for chave, rotulo in ang_opcoes %}<option value="{{ chave }}"{% if filtros.angulo == chave %} selected{% endif %}>{{ rotulo }}</option>{% endfor %}</select></label>{% else %}<p>Ângulo: definido pela perspectiva ({{ rotulo_recorte }}).</p>{% endif %}
  <label>Eixo <select name="eixo"><option value="">qualquer</option>{% for e in eixos %}<option value="{{ e }}"{% if filtros.eixo == e %} selected{% endif %}>{{ e }}</option>{% endfor %}<option value="sem_eixo"{% if filtros.eixo == "sem_eixo" %} selected{% endif %}>Sem eixo</option></select></label>
  <button class="botao" type="submit">Filtrar</button>{% if query_limpar %} <a href="{{ acao }}">Limpar</a>{% endif %}
</form>
